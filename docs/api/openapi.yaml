---
openapi: 3.0.3
info:
  title: Sure API
  version: v1
  description: OpenAPI documentation generated from executable request specs.
servers:
- url: https://app.sure.am
  description: Production
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-Api-Key
      in: header
      description: API key for authentication. Generate one from your account settings.
  schemas:
    Pagination:
      type: object
      required:
      - page
      - per_page
      - total_count
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    SavingsChallengeCampaign:
      type: object
      required:
      - id
      - name
      - short_description
      - start_date
      - end_date
      - duration_days
      - phase
      - days_remaining
      properties:
        id:
          type: string
        name:
          type: string
        short_description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        duration_days:
          type: integer
          minimum: 1
        phase:
          type: string
          enum:
          - upcoming
          - active
          - ended
        day_number:
          type: integer
          minimum: 1
          nullable: true
        days_remaining:
          type: integer
          minimum: 0
    SavingsChallengeEnrollment:
      type: object
      required:
      - id
      - goal_id
      - joined_at
      - currency
      - target_amount
      - target_amount_cents
      - starting_balance
      - starting_balance_cents
      - saved_amount
      - saved_amount_cents
      - progress_percent
      - completed
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        joined_at:
          type: string
          format: date-time
        currency:
          type: string
        target_amount:
          type: string
        target_amount_cents:
          type: integer
        starting_balance:
          type: string
        starting_balance_cents:
          type: integer
        saved_amount:
          type: string
        saved_amount_cents:
          type: integer
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        completed:
          type: boolean
    SavingsChallengeResponse:
      type: object
      required:
      - campaign
      - enrollment
      properties:
        campaign:
          "$ref": "#/components/schemas/SavingsChallengeCampaign"
        enrollment:
          allOf:
          - "$ref": "#/components/schemas/SavingsChallengeEnrollment"
          nullable: true
    FamilyExportFile:
      type: object
      required:
      - attached
      properties:
        attached:
          type: boolean
        byte_size:
          type: integer
          nullable: true
          minimum: 0
        content_type:
          type: string
          nullable: true
    FamilyExport:
      type: object
      required:
      - id
      - status
      - filename
      - downloadable
      - file
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        filename:
          type: string
        downloadable:
          type: boolean
        download_path:
          type: string
          nullable: true
        file:
          "$ref": "#/components/schemas/FamilyExportFile"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FamilyExportResponse:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/FamilyExport"
    FamilyExportCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/FamilyExport"
        meta:
          "$ref": "#/components/schemas/Pagination"
    InsightKeyFigure:
      type: object
      required:
      - value
      - caption
      properties:
        value:
          type: string
        caption:
          type: string
    InsightAction:
      type: object
      required:
      - label
      - route
      - resource_id
      properties:
        label:
          type: string
        route:
          type: string
          enum:
          - transactions
          - account
          - recurring_transactions
          - reports
          - budget
          - budgets
        resource_id:
          type: string
          format: uuid
          nullable: true
    Insight:
      type: object
      required:
      - id
      - insight_type
      - priority
      - status
      - title
      - body
      - generated_at
      - unread
      - meta_line
      - icon
      - sentiment
      properties:
        id:
          type: string
          format: uuid
        insight_type:
          type: string
          enum:
          - spending_anomaly
          - cash_flow_warning
          - net_worth_milestone
          - subscription_audit
          - savings_rate_change
          - idle_cash
          - budget_at_risk
          - budget_on_track
        priority:
          type: string
          enum:
          - high
          - medium
          - low
        status:
          type: string
          enum:
          - active
          - read
        title:
          type: string
        body:
          type: string
        currency:
          type: string
          nullable: true
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        generated_at:
          type: string
          format: date-time
        unread:
          type: boolean
        meta_line:
          type: string
        icon:
          type: string
        sentiment:
          type: string
          enum:
          - positive
          - negative
          - warning
          - neutral
        key_figure:
          allOf:
          - "$ref": "#/components/schemas/InsightKeyFigure"
          nullable: true
        action:
          allOf:
          - "$ref": "#/components/schemas/InsightAction"
          nullable: true
    InsightsResponse:
      type: object
      required:
      - insights
      - unread_count
      properties:
        insights:
          type: array
          items:
            "$ref": "#/components/schemas/Insight"
        unread_count:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        message:
          type: string
          nullable: true
        details:
          oneOf:
          - type: array
            items:
              type: string
          - type: object
          nullable: true
        errors:
          type: array
          items:
            type: string
          nullable: true
          description: Validation error messages (alternative to details used by trades,
            valuations, etc.)
    ErrorResponseWithImportId:
      type: object
      required:
      - error
      - import_id
      properties:
        error:
          type: string
        message:
          type: string
          nullable: true
        import_id:
          type: string
          format: uuid
          description: Import ID preserved for retry or inspection after upload succeeds
            but publish fails
    GenericMessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    PersonalApiKey:
      type: object
      required:
      - id
      - name
      - scopes
      - source
      - active
      - current
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - read
            - read_write
        source:
          type: string
          enum:
          - web
          - mobile
          - monitoring
        active:
          type: boolean
        current:
          type: boolean
          description: True when the request is authenticated with this API key.
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PersonalApiKeyCollection:
      type: object
      required:
      - api_keys
      - options
      properties:
        api_keys:
          type: array
          items:
            "$ref": "#/components/schemas/PersonalApiKey"
        options:
          type: object
          required:
          - scopes
          - sources
          properties:
            scopes:
              type: array
              items:
                type: string
                enum:
                - read
                - read_write
            sources:
              type: array
              items:
                type: string
                enum:
                - mobile
    PersonalApiKeyResponse:
      type: object
      required:
      - api_key
      properties:
        api_key:
          "$ref": "#/components/schemas/PersonalApiKey"
    PersonalApiKeyCreateResponse:
      type: object
      required:
      - api_key
      properties:
        api_key:
          allOf:
          - "$ref": "#/components/schemas/PersonalApiKey"
          - type: object
            required:
            - plain_key
            properties:
              plain_key:
                type: string
                description: Plain API key secret. Returned only at creation time.
    PersonalApiKeyRevokeResponse:
      type: object
      required:
      - message
      - api_key
      properties:
        message:
          type: string
        api_key:
          "$ref": "#/components/schemas/PersonalApiKey"
    BulkOperationResponse:
      type: object
      required:
      - message
      - requested_count
      - skipped_count
      properties:
        message:
          type: string
        requested_count:
          type: integer
          minimum: 0
        matched_count:
          type: integer
          minimum: 0
        updated_count:
          type: integer
          minimum: 0
        deleted_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
    TransactionAttachment:
      type: object
      required:
      - id
      - filename
      - content_type
      - byte_size
      - inline_path
      - download_path
      - created_at
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 0
        inline_path:
          type: string
        download_path:
          type: string
        created_at:
          type: string
          format: date-time
    TransactionAttachmentCollection:
      type: object
      required:
      - attachments
      properties:
        attachments:
          type: array
          items:
            "$ref": "#/components/schemas/TransactionAttachment"
    AccountStatementAccount:
      type: object
      required:
      - id
      - name
      - account_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_type:
          type: string
    AccountStatementReconciliationCheck:
      type: object
      required:
      - key
      - statement_amount
      - ledger_amount
      - difference
      - status
      properties:
        key:
          type: string
        statement_amount:
          type: string
        ledger_amount:
          type: string
        difference:
          type: string
        status:
          type: string
          enum:
          - matched
          - mismatched
    AccountStatement:
      type: object
      required:
      - id
      - filename
      - content_type
      - byte_size
      - source
      - upload_status
      - review_status
      - currency
      - manageable
      - download_path
      - account
      - suggested_account
      - reconciliation_checks
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
          minimum: 0
        source:
          type: string
        upload_status:
          type: string
          enum:
          - stored
          - failed
        review_status:
          type: string
          enum:
          - unmatched
          - linked
          - rejected
        institution_name_hint:
          type: string
          nullable: true
        account_name_hint:
          type: string
          nullable: true
        account_last4_hint:
          type: string
          nullable: true
        period_start_on:
          type: string
          format: date
          nullable: true
        period_end_on:
          type: string
          format: date
          nullable: true
        opening_balance:
          type: string
          nullable: true
        closing_balance:
          type: string
          nullable: true
        currency:
          type: string
        parser_confidence:
          type: string
          nullable: true
        match_confidence:
          type: string
          nullable: true
        manageable:
          type: boolean
        download_path:
          type: string
        account:
          allOf:
          - "$ref": "#/components/schemas/AccountStatementAccount"
          nullable: true
        suggested_account:
          allOf:
          - "$ref": "#/components/schemas/AccountStatementAccount"
          nullable: true
        reconciliation_checks:
          type: array
          items:
            "$ref": "#/components/schemas/AccountStatementReconciliationCheck"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountStatementCollection:
      type: object
      required:
      - account_statements
      - pagination
      properties:
        account_statements:
          type: array
          items:
            "$ref": "#/components/schemas/AccountStatement"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    AccountStatementUploadResponse:
      type: object
      required:
      - account_statements
      - duplicates
      - errors
      properties:
        account_statements:
          type: array
          items:
            "$ref": "#/components/schemas/AccountStatement"
        duplicates:
          type: array
          items:
            type: object
            required:
            - id
            - filename
            properties:
              id:
                type: string
                format: uuid
              filename:
                type: string
        errors:
          type: array
          items:
            type: string
    FamilyDocument:
      type: object
      required:
      - id
      - filename
      - content_type
      - file_size
      - status
      - metadata
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - error
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FamilyDocumentResponse:
      type: object
      required:
      - family_document
      properties:
        family_document:
          "$ref": "#/components/schemas/FamilyDocument"
    FamilyDocumentVectorStoreCapabilities:
      type: object
      required:
      - configured
      - supported_upload_extensions
      - max_upload_size
      properties:
        configured:
          type: boolean
        supported_upload_extensions:
          type: array
          items:
            type: string
        max_upload_size:
          type: integer
          minimum: 0
    FamilyDocumentCollection:
      type: object
      required:
      - family_documents
      - pagination
      - vector_store
      properties:
        family_documents:
          type: array
          items:
            "$ref": "#/components/schemas/FamilyDocument"
        pagination:
          "$ref": "#/components/schemas/Pagination"
        vector_store:
          "$ref": "#/components/schemas/FamilyDocumentVectorStoreCapabilities"
    FamilyDocumentSearchResult:
      type: object
      required:
      - filename
      - content
      - score
      properties:
        filename:
          type: string
        content:
          type: string
        score:
          type: number
          nullable: true
    FamilyDocumentSearchResponse:
      type: object
      required:
      - query
      - result_count
      - results
      properties:
        query:
          type: string
        result_count:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            "$ref": "#/components/schemas/FamilyDocumentSearchResult"
    MfaRequiredResponse:
      type: object
      required:
      - error
      - mfa_required
      properties:
        error:
          type: string
        mfa_required:
          type: boolean
    ToolCall:
      type: object
      required:
      - id
      - function_name
      - function_arguments
      - created_at
      properties:
        id:
          type: string
          format: uuid
        function_name:
          type: string
        function_arguments:
          type: object
          additionalProperties: true
        function_result:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - id
      - type
      - role
      - content
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - user_message
          - assistant_message
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        model:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tool_calls:
          type: array
          items:
            "$ref": "#/components/schemas/ToolCall"
          nullable: true
        attachment:
          type: object
          nullable: true
          description: Present when the message has a file attachment.
          required:
          - filename
          - content_type
          - byte_size
          - url
          properties:
            filename:
              type: string
            content_type:
              type: string
            byte_size:
              type: integer
            url:
              type: string
              description: API path that redirects to the file (auth required).
    MessageResponse:
      allOf:
      - "$ref": "#/components/schemas/Message"
      - type: object
        required:
        - chat_id
        properties:
          chat_id:
            type: string
            format: uuid
          ai_response_status:
            type: string
            enum:
            - pending
            - complete
            - failed
            nullable: true
          ai_response_message:
            type: string
            nullable: true
    ChatResource:
      type: object
      required:
      - id
      - title
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatSummary:
      allOf:
      - "$ref": "#/components/schemas/ChatResource"
      - type: object
        required:
        - message_count
        properties:
          message_count:
            type: integer
            minimum: 0
          last_message_at:
            type: string
            format: date-time
            nullable: true
    ChatDetail:
      allOf:
      - "$ref": "#/components/schemas/ChatResource"
      - type: object
        required:
        - messages
        properties:
          messages:
            type: array
            items:
              "$ref": "#/components/schemas/Message"
          pagination:
            "$ref": "#/components/schemas/Pagination"
            nullable: true
    ChatUpdates:
      allOf:
      - "$ref": "#/components/schemas/ChatResource"
      - type: object
        required:
        - messages
        - pending_response
        - server_time
        properties:
          messages:
            type: array
            description: Messages created or updated since the `since` cursor (all
              messages when omitted). Upsert by id.
            items:
              "$ref": "#/components/schemas/Message"
          pending_response:
            type: boolean
            description: True while an assistant response is still being generated;
              keep polling.
          server_time:
            type: string
            format: date-time
            description: Cursor to pass as `since` on the next poll.
    ChatCollection:
      type: object
      required:
      - chats
      - pagination
      properties:
        chats:
          type: array
          items:
            "$ref": "#/components/schemas/ChatSummary"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    RetryResponse:
      type: object
      required:
      - message
      - message_id
      - chat_id
      properties:
        message:
          type: string
        message_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
    MessageTimeoutReportResponse:
      type: object
      required:
      - message
      - resolved
      - chat_id
      - message_id
      properties:
        message:
          type: string
        resolved:
          type: boolean
        chat_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
    Account:
      type: object
      required:
      - id
      - name
      - account_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_type:
          type: string
          nullable: true
        status:
          type: string
    UserSummary:
      type: object
      required:
      - id
      - email
      - display_name
      - initials
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        initials:
          type: string
    UserProfile:
      type: object
      required:
      - id
      - email
      - pending_email_change
      - display_name
      - initials
      - role
      - active
      - theme
      - default_period
      - default_account_order
      - show_sidebar
      - show_ai_sidebar
      - ai_enabled
      - ai_available
      - rule_prompts_disabled
      - goals
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        unconfirmed_email:
          type: string
          format: email
          nullable: true
        pending_email_change:
          type: boolean
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        display_name:
          type: string
        initials:
          type: string
        role:
          type: string
          enum:
          - guest
          - member
          - admin
          - super_admin
        active:
          type: boolean
        locale:
          type: string
          nullable: true
        theme:
          type: string
          nullable: true
        default_period:
          type: string
        default_account_order:
          type: string
        show_sidebar:
          type: boolean
        show_ai_sidebar:
          type: boolean
        ai_enabled:
          type: boolean
        ai_available:
          type: boolean
        rule_prompts_disabled:
          type: boolean
          nullable: true
        rule_prompt_dismissed_at:
          type: string
          format: date-time
          nullable: true
        onboarded_at:
          type: string
          format: date-time
          nullable: true
        set_onboarding_preferences_at:
          type: string
          format: date-time
          nullable: true
        set_onboarding_goals_at:
          type: string
          format: date-time
          nullable: true
        goals:
          type: array
          items:
            type: string
        default_account_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfileFamily:
      type: object
      required:
      - id
      - currency
      - locale
      - date_format
      - month_start_day
      - moniker
      - default_account_sharing
      - custom_enabled_currencies
      - enabled_currencies
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        currency:
          type: string
        locale:
          type: string
        date_format:
          type: string
        country:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        month_start_day:
          type: integer
        moniker:
          type: string
        default_account_sharing:
          type: string
          enum:
          - shared
          - private
        custom_enabled_currencies:
          type: boolean
        enabled_currencies:
          type: array
          items:
            type: string
        created_at:
          type: string
