        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/chunks":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Upload import session chunk
      description: Attach an ordered Sure NDJSON chunk to an import session. Chunks
        are idempotent by sequence and client_chunk_id with content verification.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sequence
              - raw_file_content
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                raw_file_content:
                  type: string
                  description: Raw Sure NDJSON content. Each chunk is limited to 10MB.
          multipart/form-data:
            schema:
              type: object
              required:
              - sequence
              - file
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                file:
                  type: string
                  format: binary
                  description: Multipart Sure NDJSON file upload. Each chunk is limited
                    to 10MB.
      parameters: []
      responses:
        '201':
          description: chunk uploaded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: chunk conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: missing or invalid content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/publish":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Publish import session
      description: Queue ordered chunk processing for a SureImport session. Later
        chunks can reference source IDs mapped by earlier chunks.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: import session publish queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: max_row_count_exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: missing expected chunks
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: enqueue failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
