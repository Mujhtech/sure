  "/api/v1/provider_connections/{provider_key}":
    parameters:
    - name: provider_key
      in: path
      description: Provider key. Credential-backed setup supports akahu, up, lunchflow,
        mercury, brex, sophtron, coinbase, binance, kraken, ibkr, indexa_capital,
        coinstats, and enable_banking. Plaid supports public_token exchange. SimpleFIN
        supports setup_token claim.
      required: true
      schema:
        type: string
    post:
      summary: Creates a provider connection
      description: Creates a provider connection, schedules the initial sync when
        the provider supports it, and returns safe provider connection status metadata.
        Credential-backed providers accept their API credentials. Plaid accepts the
        public_token returned by Plaid Link. SimpleFIN accepts a setup_token from
        SimpleFIN Bridge. CoinStats validates api_key before saving. Sophtron validates
        credentials and provisions a family customer before institution login. Enable
        Banking accepts country_code, application_id, and client_certificate before
        bank authorization.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: provider connection created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnectionMutationResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: family admin required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: provider not supported
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: provider connection validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_connection
              properties:
                provider_connection:
                  type: object
                  properties:
                    name:
                      type: string
                    sync_start_date:
                      type: string
                      format: date
                    token:
                      type: string
                      description: Mercury or Brex token
                    base_url:
                      type: string
                      nullable: true
                    api_key:
                      type: string
                      description: CoinStats, Coinbase, Binance, Kraken, or Lunch
                        Flow API key
                    api_secret:
                      type: string
                      description: Coinbase, Binance, or Kraken API secret
                    access_token:
                      type: string
                      description: Up access token
                    app_token:
                      type: string
                      description: Akahu app token
                    user_token:
                      type: string
                      description: Akahu user token
                    query_id:
                      type: string
                      description: Interactive Brokers Flex Query ID
                    api_token:
                      type: string
                      description: Indexa Capital API token
                    username:
                      type: string
                      description: Indexa Capital username
                    document:
                      type: string
                      description: Indexa Capital document identifier
                    password:
                      type: string
                      description: Indexa Capital password
                    public_token:
                      type: string
                      description: Plaid public token returned by Plaid Link
                    region:
                      type: string
                      enum:
                      - us
                      - eu
                      description: Plaid region
                    item_name:
                      type: string
                      description: Plaid, SimpleFIN, or CoinStats institution display
                        name
                    setup_token:
                      type: string
                      description: SimpleFIN setup token returned by SimpleFIN Bridge
                    country_code:
                      type: string
                      description: Enable Banking ASPSP country code
                    application_id:
                      type: string
                      description: Enable Banking application ID
                    client_certificate:
                      type: string
                      description: Enable Banking private key PEM
                    user_id:
                      type: string
                      description: Sophtron User ID
                    access_key:
                      type: string
                      description: Sophtron Access Key
        required: true
  "/api/v1/provider_connections/{provider_key}/{id}":
    parameters:
    - name: provider_key
      in: path
      description: 'Credential-backed provider key. Supported here: akahu, up, lunchflow,
        mercury, brex, sophtron, coinbase, binance, kraken, ibkr, indexa_capital,
        coinstats, and enable_banking. SimpleFIN supports metadata updates and setup_token
        reconnect.'
      required: true
      schema:
        type: string
    - name: id
      in: path
      format: uuid
      description: Provider connection item ID from the provider connection status
        list
      required: true
      schema:
        type: string
    patch:
      summary: Updates a provider connection
      description: Updates safe provider connection settings or credentials. Blank
        credential fields are ignored on update so clients can edit metadata without
        resubmitting secrets. SimpleFIN setup_token updates are queued because reconnect
        can take longer than a mobile request should wait. CoinStats validates a nonblank
        api_key before saving. Sophtron validates nonblank credential changes and
        reprovisions the family customer if needed.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: provider connection updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnectionMutationResponse"
        '202':
          description: SimpleFIN reconnect scheduled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnectionMutationResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: family admin required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: provider connection not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_connection
              properties:
                provider_connection:
                  type: object
                  properties:
                    name:
                      type: string
                    sync_start_date:
                      type: string
                      format: date
                    token:
                      type: string
                    base_url:
                      type: string
                      nullable: true
                    api_key:
                      type: string
                    api_secret:
                      type: string
                    access_token:
                      type: string
                    app_token:
                      type: string
                    user_token:
                      type: string
                    query_id:
                      type: string
                    api_token:
                      type: string
                    username:
                      type: string
                    document:
                      type: string
                    password:
                      type: string
                    setup_token:
                      type: string
                      description: SimpleFIN setup token for reconnecting an existing
                        item
                    country_code:
                      type: string
                    application_id:
                      type: string
                    client_certificate:
                      type: string
                      description: Enable Banking private key PEM. Blank values are
                        ignored on update.
                    user_id:
                      type: string
                      description: Sophtron User ID. Blank values are ignored on update.
                    access_key:
                      type: string
                      description: Sophtron Access Key. Blank values are ignored on
                        update.
        required: true
    delete:
      summary: Schedules a provider connection for deletion
      description: Detaches provider account links when supported, schedules the provider
        connection for deletion, and returns refreshed safe provider connection status
        metadata. Requires a read_write key and family admin user.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: provider connection scheduled for deletion
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderConnectionDestroyActionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: family admin required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: connection not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
