  "/api/v1/financial_replay":
    get:
      summary: Show a completed Financial Replay
      tags:
      - Financial Replay
      description: Returns a ten-slide-ready recap for a completed calendar month.
        Defaults to the latest completed month and includes privacy-safe AI-refined
        archetype copy with a deterministic fallback.
      security:
      - apiKeyAuth: []
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        description: Most recent completed calendar month in YYYY-MM format. Defaults
          to the previous month; older months are rejected.
      responses:
        '200':
          description: financial replay returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FinancialReplayResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: month is incomplete or malformed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
