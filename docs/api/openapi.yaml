  "/api/v1/insights":
    get:
      summary: List proactive financial insights
      tags:
      - Insights
      description: Returns visible insights in priority order and marks new insights
        as read after building the response.
      security:
      - apiKeyAuth: []
      parameters:
      - name: mark_read
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Set to false for previews that must preserve unread state.
      responses:
        '200':
          description: insights returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InsightsResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/insights/{id}/dismiss":
    patch:
      summary: Dismiss an insight
      tags:
      - Insights
      security:
      - apiKeyAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: insight dismissed
          content:
            application/json:
              schema:
                type: object
                required:
                - insight
                properties:
                  insight:
                    type: object
                    required:
                    - id
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - dismissed
  "/api/v1/insights/{id}/undismiss":
    patch:
      summary: Restore a dismissed insight
      tags:
      - Insights
      security:
      - apiKeyAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: insight restored as read
  "/api/v1/insights/refresh":
    post:
      summary: Queue insight regeneration
      tags:
      - Insights
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: generation queued
