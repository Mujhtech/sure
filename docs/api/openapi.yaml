  "/api/v1/valuations":
    get:
      summary: List valuations
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      - name: account_id
        in: query
        required: false
        description: Filter by account ID
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        required: false
        description: Filter valuations from this date
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: Filter valuations until this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: valuations listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValuationCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid account filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create valuation
      tags:
      - Valuations
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: valuation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '200':
          description: existing valuation upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Valuation"
        '422':
          description: validation error - missing date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                valuation:
                  type: object
                  properties:
                    account_id:
                      type: string
                      format: uuid
                      description: Account ID (required)
                    amount:
                      type: number
                      description: Valuation amount (required)
                    date:
                      type: string
                      format: date
                      description: Valuation date (required)
                    notes:
                      type: string
                      description: Additional notes
                    upsert:
                      type: boolean
                      description: Nested alternative to the top-level response-status
                        flag. Top-level upsert takes precedence when both are provided.
                  required:
                  - account_id
                  - amount
                  - date
                upsert:
                  type: boolean
                  description: Response-status signal only. When true and a same-account
                    same-date valuation exists before the request, the endpoint returns
                    200 OK instead of 201 Created. The underlying reconciliation write
                    path is unchanged; this flag does not add duplicate-prevention
                    or safe-retry guarantees beyond existing same-date reconciliation
                    behavior.
              required:
              - valuation
        required: true
