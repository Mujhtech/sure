      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom report start date. ISO 8601 only.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom report end date. ISO 8601 only.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - amount
          - count
        description: Sort transaction breakdown rows by amount or count.
      - name: sort_direction
        in: query
        required: false
        schema:
          type: string
          enum:
