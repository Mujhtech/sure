      description: Updates current-user profile and preference fields. Admins may
        also update nested family settings.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: current user profile updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfileResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    email:
                      type: string
                      format: email
                    locale:
                      type: string
                    theme:
                      type: string
                      enum:
                      - light
                      - dark
                      - system
                    default_period:
                      type: string
                    default_account_order:
                      type: string
                    show_sidebar:
                      type: boolean
                    show_ai_sidebar:
                      type: boolean
                    ai_enabled:
                      type: boolean
                    goals:
                      type: array
                      items:
                        type: string
                    family:
                      type: object
                      description: Admin-only family settings update payload.
                      properties:
                        name:
                          type: string
                        currency:
                          type: string
                        country:
                          type: string
                        date_format:
                          type: string
                        timezone:
                          type: string
                        locale:
                          type: string
                        month_start_day:
                          type: integer
                        moniker:
                          type: string
                        default_account_sharing:
                          type: string
                          enum:
                          - shared
                          - private
                        enabled_currencies:
                          type: array
                          items:
                            type: string
              required:
              - user
        required: true
    delete:
      summary: Delete account
      tags:
      - Users
      description: Permanently deactivates the current user account and all associated
        data. This action cannot be undone.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessMessage"
        '401':
          description: unauthorized
        '403':
          description: insufficient scope
        '422':
          description: deactivation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
