  "/api/v1/provider_connections/{provider_key}/{id}/accounts":
    parameters:
    - name: provider_key
      in: path
      description: Provider key from the provider connection status list
      required: true
      schema:
        type: string
    - name: id
      in: path
      format: uuid
      description: Provider connection item ID from the provider connection status
        list
      required: true
      schema:
        type: string
    - name: unlinked_only
      in: query
      required: false
      description: When true, only provider accounts that still need setup are returned
      schema:
        type: boolean
    get:
      summary: Lists discovered provider accounts for setup
      description: Lists safe provider-side accounts discovered during provider sync,
        including linked state, supported Sure account types, and setup suggestions.
        Requires a read or read_write key and family admin user.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: provider accounts listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderAccountCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: family admin required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: connection not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/provider_connections/{provider_key}/{id}/accounts/{provider_account_id}/link":
    parameters:
    - name: provider_key
      in: path
      description: Provider key from the provider connection status list
      required: true
      schema:
        type: string
    - name: id
      in: path
      format: uuid
      description: Provider connection item ID from the provider connection status
        list
      required: true
      schema:
        type: string
    - name: provider_account_id
      in: path
      format: uuid
      description: Provider-side account ID returned from the provider account setup
        list
      required: true
      schema:
        type: string
    post:
      summary: Links a discovered provider account
      description: Links a provider-discovered account to either an existing manual
        Sure account or a newly created Sure account, then schedules provider sync
        when possible. Pass account_id to link an existing manual account, or accountable_type/subtype/name/balance/currency
        to create one. Pass action=skip for providers whose accounts support being
        ignored.
      tags:
      - Provider Connections
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: provider account linked to a new account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProviderAccountSetupResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: family admin required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: provider account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: provider account already linked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: unsupported account type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - provider_account
              properties:
                provider_account:
                  type: object
                  properties:
                    action:
                      type: string
                      enum:
                      - skip
                      description: Optional; skips the provider account when the provider
                        supports ignored accounts.
                    account_id:
                      type: string
                      format: uuid
                      description: Existing manual Sure account to link.
                    accountable_type:
                      type: string
                      enum:
                      - Depository
                      - CreditCard
                      - Loan
                      - Investment
                      - Crypto
                      - OtherAsset
                      description: Sure account type to create when account_id is
                        omitted.
                    subtype:
                      type: string
                      nullable: true
                    name:
                      type: string
                      nullable: true
                    balance:
                      type: string
                      nullable: true
                    cash_balance:
                      type: string
                      nullable: true
                    currency:
                      type: string
                      nullable: true
                    opening_balance_date:
                      type: string
                      format: date
                      nullable: true
        required: true
