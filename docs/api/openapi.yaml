      - name: filter_category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Restrict transaction breakdown to a category and its subcategories.
      - name: filter_tag_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Restrict transaction breakdown to transactions with this tag.
