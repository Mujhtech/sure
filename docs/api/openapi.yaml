    parameters:
    - name: chat_id
      in: path
      required: true
      description: Chat ID
      schema:
        type: string
    post:
      summary: Create a message
      tags:
      - Chat Messages
      description: 'Creates a user message and triggers an asynchronous AI response.
        Also accepts multipart/form-data with an optional `file` part (max 25MB):
        PDFs are queued as bank statement imports, other supported documents go to
        the family document store, and the attachment metadata is returned on the
        message. Provide `content`, `file`, or both.'
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: message created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
        '404':
          description: chat not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                model:
                  type: string
                file:
                  type: string
                  format: binary
                  description: Optional attachment (multipart/form-data only)
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                model:
                  type: string
                file:
                  type: string
                  format: binary
                  description: Optional attachment (multipart/form-data only)
        required: true
