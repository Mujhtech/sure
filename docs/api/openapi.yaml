      schema:
        type: string
    get:
      summary: Poll a chat for updates
      tags:
      - Chats
      description: Incremental polling endpoint. Returns messages created or updated
        since the given cursor, plus whether an assistant response is still pending.
        Pass the returned server_time as the since parameter on the next poll and
        upsert messages by id (the window is inclusive).
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: chat updates returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChatUpdates"
