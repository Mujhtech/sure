                "$ref": "#/components/schemas/ImportResponse"
        '404':
          description: import not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update import account assignment
      description: Assign or clear the account used by an import. For PDF imports,
        assigning an account also links the backing account statement.
      tags:
      - Imports
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: import account assignment updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportResponse"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import or account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
