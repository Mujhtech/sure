          type: string
          description: Account native currency
        balance:
          "$ref": "#/components/schemas/Money"
        converted_balance:
          "$ref": "#/components/schemas/Money"
          description: Account balance converted to the family primary currency
        classification:
          type: string
          enum:
          - asset
          - liability
        account_type:
          type: string
        weight:
          type: number
    SuccessMessage:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ResetInitiatedResponse:
      type: object
      required:
      - message
      - status
      - job_id
      - family_id
      - sample_data
      - status_url
      properties:
        message:
          type: string
        status:
          type: string
          enum:
          - queued
        job_id:
          type: string
          description: Informational Active Job identifier returned by the queue adapter;
            reset status is family-scoped, not job-scoped.
        family_id:
          type: string
          format: uuid
          description: UUID of the family being reset.
        sample_data:
          type: boolean
          description: True when the queued reset will load demo sample data after
            clearing existing financial data.
        status_url:
          type: string
    ResetStatusResponse:
      type: object
      required:
      - status
      - family_id
      - reset_complete
      - counts
      properties:
        status:
          type: string
          enum:
          - complete
          - data_remaining
          description: Counts-based family reset status at response time.
        family_id:
          type: string
          format: uuid
          description: UUID of the family whose reset target counts were checked.
        reset_complete:
          type: boolean
          description: True when all reset target counts are zero at response time.
            This is a family data snapshot, not a durable per-job completion record.
        counts:
          type: object
          required:
          - account_statements
          - family_exports
          - imports
          - import_sessions
          - import_source_mappings
          - import_rows
          - import_mappings
          - accounts
          - account_shares
          - account_providers
          - entries
          - transactions
          - transfers
          - rejected_transfers
          - valuations
          - trades
          - holdings
          - balances
          - recurring_transactions
          - rules
          - rule_actions
          - rule_conditions
          - rule_runs
          - budgets
          - budget_categories
          - categories
          - tags
          - taggings
          - merchants
          - family_merchant_associations
          - provider_items
          - active_storage_attachments
          - plaid_items
          additionalProperties:
            type: integer
            minimum: 0
          properties:
            account_statements:
              type: integer
              minimum: 0
            family_exports:
              type: integer
              minimum: 0
            imports:
              type: integer
              minimum: 0
            import_sessions:
              type: integer
              minimum: 0
            import_source_mappings:
              type: integer
              minimum: 0
            import_rows:
              type: integer
              minimum: 0
            import_mappings:
              type: integer
              minimum: 0
            accounts:
              type: integer
              minimum: 0
            account_shares:
              type: integer
              minimum: 0
            account_providers:
              type: integer
              minimum: 0
            entries:
              type: integer
              minimum: 0
            transactions:
              type: integer
              minimum: 0
            transfers:
              type: integer
              minimum: 0
            rejected_transfers:
              type: integer
              minimum: 0
            valuations:
              type: integer
              minimum: 0
            trades:
              type: integer
              minimum: 0
            holdings:
              type: integer
              minimum: 0
            balances:
              type: integer
              minimum: 0
            recurring_transactions:
              type: integer
              minimum: 0
            rules:
              type: integer
              minimum: 0
            rule_actions:
              type: integer
              minimum: 0
            rule_conditions:
              type: integer
              minimum: 0
            rule_runs:
              type: integer
              minimum: 0
            budgets:
              type: integer
              minimum: 0
            budget_categories:
              type: integer
              minimum: 0
            categories:
              type: integer
              minimum: 0
            tags:
              type: integer
              minimum: 0
            taggings:
              type: integer
              minimum: 0
            merchants:
              type: integer
              minimum: 0
            family_merchant_associations:
              type: integer
              minimum: 0
            provider_items:
              type: integer
              minimum: 0
            active_storage_attachments:
              type: integer
              minimum: 0
            plaid_items:
              type: integer
              minimum: 0
paths:
  "/api/v1/account_statements":
    get:
      summary: List account statements
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        required: false
        schema:
          type: string
      - name: review_status
        in: query
        required: false
        enum:
        - unmatched
        - linked
        - rejected
        schema:
          type: string
        description: ":\n * `unmatched` \n * `linked` \n * `rejected` \n "
      - name: upload_status
        in: query
        required: false
        enum:
        - stored
        - failed
        schema:
          type: string
      responses:
        '200':
          description: account statements listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatementCollection"
    post:
      summary: Upload account statement
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: account statement uploaded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatementUploadResponse"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
        description: PDF, CSV, or XLSX statement file
  "/api/v1/account_statements/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Account statement ID
      schema:
        type: string
    get:
      summary: Retrieve account statement
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account statement retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatement"
    patch:
      summary: Update account statement
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: account statement updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatement"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_statement:
                  type: object
                  properties:
                    account_id:
                      type: string
                      format: uuid
                      nullable: true
                    institution_name_hint:
                      type: string
                      nullable: true
                    account_name_hint:
                      type: string
                      nullable: true
                    account_last4_hint:
                      type: string
                      nullable: true
                    period_start_on:
                      type: string
                      format: date
                      nullable: true
                    period_end_on:
                      type: string
                      format: date
                      nullable: true
                    opening_balance:
                      type: string
                      nullable: true
                    closing_balance:
                      type: string
                      nullable: true
                    currency:
                      type: string
                      nullable: true
        required: true
    delete:
      summary: Delete account statement
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account statement deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GenericMessageResponse"
  "/api/v1/account_statements/{id}/link":
    parameters:
    - name: id
      in: path
      required: true
      description: Account statement ID
      schema:
        type: string
    patch:
      summary: Link account statement to an account
      tags:
      - Account Statements
      description: Links an unmatched statement to the supplied account_id, or to
        the statement suggested_account when account_id is omitted.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: account statement linked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatement"
        '404':
          description: account or statement not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  format: uuid
                  nullable: true
  "/api/v1/account_statements/{id}/unlink":
    parameters:
    - name: id
      in: path
      required: true
      description: Account statement ID
      schema:
        type: string
    patch:
      summary: Unlink account statement from its account
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account statement unlinked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatement"
  "/api/v1/account_statements/{id}/reject":
    parameters:
    - name: id
      in: path
      required: true
      description: Account statement ID
      schema:
        type: string
    patch:
      summary: Reject suggested account statement match
      tags:
      - Account Statements
      description: Marks an unmatched statement suggestion as rejected and clears
        suggested_account.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account statement suggestion rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountStatement"
  "/api/v1/account_statements/{id}/download":
    parameters:
    - name: id
      in: path
      required: true
      description: Account statement ID
      schema:
        type: string
    get:
      summary: Download account statement file
      tags:
      - Account Statements
      security:
      - apiKeyAuth: []
      responses:
        '302':
          description: redirects to statement file
  "/api/v1/account_types":
    get:
      summary: Lists account type metadata
      description: Lists backend-owned account type metadata for native clients, including
        labels, classifications, colors, icons, subtypes, and available provider connection
        descriptors.
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account type metadata listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountTypeCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/accountable_sparklines/{accountable_type}":
    parameters:
    - name: accountable_type
      in: path
      required: true
      description: Account type, for example depository, credit_card, investment,
        crypto, loan.
      schema:
        type: string
    get:
      summary: Retrieve account type aggregate series
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - last_day
          - current_week
          - last_7_days
          - current_month
          - last_month
          - last_30_days
          - last_90_days
          - current_year
          - last_365_days
          - last_5_years
          - last_10_years
          - all_time
        description: Preset period key. Ignored when start_date or end_date is supplied.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom series start date. ISO 8601 only.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom series end date. ISO 8601 only.
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1 day
          - 1 week
          - 1 month
        description: Series interval override.
      responses:
        '200':
          description: account type series returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountableSparklineResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: unknown account type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/accounts":
    get:
      summary: List accounts
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      - name: include_disabled
        in: query
        required: false
        description: Include disabled accounts in the response. Defaults to false.
        schema:
          type: boolean
      responses:
        '200':
          description: accounts paginated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountCollection"
  "/api/v1/accounts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Account ID
      schema:
        type: string
        format: uuid
    get:
      summary: Retrieve an account
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      parameters:
      - name: include_disabled
        in: query
        required: false
        description: Allow retrieving a disabled account. Defaults to false.
        schema:
          type: boolean
      responses:
        '200':
          description: account retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountDetail"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/accounts/{id}/series":
    parameters:
    - name: id
      in: path
      required: true
      description: Account ID
      schema:
        type: string
        format: uuid
    get:
      summary: Retrieve account balance series
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - balance
          - cash_balance
          - holdings_balance
        description: Balance series view. Defaults to balance.
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - last_day
          - current_week
          - last_7_days
          - current_month
          - last_month
          - last_30_days
          - last_90_days
          - current_year
          - last_365_days
          - last_5_years
          - last_10_years
          - all_time
        description: Preset period key. Ignored when start_date or end_date is supplied.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom series start date. ISO 8601 only.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Custom series end date. ISO 8601 only.
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1 day
          - 1 week
          - 1 month
        description: Series interval override.
      responses:
        '200':
          description: account series returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountSeriesResponse"
        '422':
          description: invalid series view
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/accounts/{id}/unlink":
    parameters:
    - name: id
      in: path
      required: true
      description: Account ID
      schema:
        type: string
        format: uuid
    delete:
      summary: Unlink an account provider
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      description: Disconnect provider links from an account while keeping the account,
        its balances, transactions, and holdings available as manual data.
      responses:
        '200':
          description: account unlinked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountDetail"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: account is not linked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/accounts/{account_id}/sharing":
    parameters:
    - name: account_id
      in: path
      required: true
      description: Account ID
      schema:
        type: string
        format: uuid
    get:
      summary: Retrieve account sharing state
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: account sharing retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountSharingResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update account sharing
      tags:
      - Accounts
      security:
      - apiKeyAuth: []
      description: Account owners can grant or revoke family member access. Shared
        users can only update their own include_in_finances preference.
      parameters: []
      responses:
        '200':
          description: shared user finance inclusion updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountSharingResponse"
        '403':
          description: shared user cannot update member access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sharing:
                  type: object
                  properties:
                    include_in_finances:
                      type: boolean
                      description: 'For shared users: whether this account is included
                        in their finances.'
                    members:
                      type: array
                      description: 'For account owners: desired sharing changes.'
                      items:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          shared:
                            type: boolean
                          permission:
                            type: string
                            enum:
                            - full_control
                            - read_write
                            - read_only
                        required:
                        - user_id
                        - shared
              required:
              - sharing
        required: true
  "/api/v1/admin/invitations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Invitation ID
      schema:
        type: string
        format: uuid
    delete:
      summary: Delete admin invitation
      tags:
      - Admin Invitations
      description: Deletes a pending or historical invitation by ID. Requires a read_write
        credential owned by a super admin.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: invitation deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminInvitationDeleteResponse"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: invitation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/admin/families/{id}/invitations":
    parameters:
    - name: id
      in: path
      required: true
      description: Family ID
      schema:
        type: string
        format: uuid
    delete:
      summary: Delete all pending admin family invitations
      tags:
      - Admin Invitations
      description: Deletes all currently pending invitations for a family. Accepted
        or expired invitations are left untouched.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: pending invitations deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminFamilyInvitationsDeleteResponse"
  "/api/v1/admin/sso_providers":
    get:
      summary: List admin SSO providers
      tags:
      - Admin SSO Providers
      description: Lists database-managed SSO providers and read-only runtime providers.
        Requires a read-capable credential owned by a super admin.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: SSO providers listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSsoProviderCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create admin SSO provider
      tags:
      - Admin SSO Providers
      description: Creates a database-managed SSO provider. Client secrets are accepted
        but never returned.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: SSO provider created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSsoProviderResponse"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminSsoProviderCreateRequest"
  "/api/v1/admin/sso_providers/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: SSO provider ID
      schema:
        type: string
        format: uuid
    get:
      summary: Retrieve admin SSO provider
      tags:
      - Admin SSO Providers
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: SSO provider retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSsoProviderResponse"
        '404':
          description: SSO provider not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update admin SSO provider
      tags:
      - Admin SSO Providers
      description: Updates a database-managed SSO provider. Blank client_secret values
        preserve the existing secret.
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: SSO provider updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSsoProviderResponse"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminSsoProviderUpdateRequest"
    delete:
      summary: Delete admin SSO provider
      tags:
      - Admin SSO Providers
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: SSO provider deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessMessage"
  "/api/v1/admin/sso_providers/{id}/toggle":
    parameters:
    - name: id
      in: path
      required: true
      description: SSO provider ID
      schema:
        type: string
        format: uuid
    patch:
      summary: Toggle admin SSO provider
      tags:
      - Admin SSO Providers
      description: Enables or disables a database-managed SSO provider.
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: SSO provider toggled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSsoProviderResponse"
  "/api/v1/admin/sso_providers/{id}/test_connection":
    parameters:
    - name: id
      in: path
      required: true
      description: SSO provider ID
      schema:
        type: string
        format: uuid
    post:
      summary: Test admin SSO provider connection
      tags:
      - Admin SSO Providers
      description: Runs the same SSO configuration validation used by the web admin
        UI. Requires a read_write credential owned by a super admin.
      security:
